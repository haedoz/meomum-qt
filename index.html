<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="description" content="말씀을 읽고 묵상을 남기는 나만의 QT 노트">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="말씀일지">
<link rel="apple-touch-icon" href="./icon-192.png"><link rel="manifest" href="./manifest.webmanifest">
<link rel="preload" href="./fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./style.css?v=50"><title>말씀일지</title>
<script type="module" src="./app.js?v=52"></script>

<body>
<header class="top"><div class="frame top-inner"><div class="top-start"><button class="back-button icon-action" data-action="back" data-icon="back" aria-label="뒤로가기" hidden></button><a class="brand" href="#today"><span class="brand-icon" data-icon="book"></span>말씀일지</a></div><button class="settings" data-nav="settings" aria-label="저장 및 설정" data-icon="settings"></button></div></header>

</div></nav>
</div>

<noscript>QT 노트를 쓰려면 브라우저에서 자바스크립트를 켜주세요.</noscript>
