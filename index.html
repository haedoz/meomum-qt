<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="app-version" content="meomum-pages-v276">
<meta name="theme-color" content="#ffffff"><meta name="description" content="말씀을 읽고 묵상을 남기는 나만의 QT 노트">

<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="로그바이블">

<link rel="preload" href="./fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<title>로그바이블</title>
<script>
(()=>{
 const root=document.documentElement;
 let paper='',mode='',palette='gray';
 try{const stored=localStorage.getItem('logbible-launch-palette');if(['gray','slate','lavender','oat'].includes(stored))palette=stored;paper=localStorage.getItem('logbible-launch-paper')||'';mode=localStorage.getItem('logbible-launch-mode')||'';}catch{}
 const valid=/^#[0-9a-f]{6}$/i.test(paper);
 const previousDark=valid&&(parseInt(paper.slice(1,3),16)*.299+parseInt(paper.slice(3,5),16)*.587+parseInt(paper.slice(5,7),16)*.114<128);
 const dark=mode==='dark'||(mode==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)||(!mode&&(valid?previousDark:matchMedia('(prefers-color-scheme: dark)').matches));
 const changed=valid&&previousDark!==dark;
 const background=valid&&!changed?paper:(dark?'#2d2e31':'#f5f5f5');
 root.dataset.palette=palette;
 root.dataset.appearance=dark?'dark':'light';
 root.style.colorScheme=dark?'dark':'only light';
 root.style.backgroundColor=background;
 root.style.setProperty('--launch-paper',background);
 document.querySelector('meta[name=color-scheme]').content=dark?'dark':'only light';
 document.querySelector('meta[name=theme-color]').content=background;
})();
</script>
<style>html.app-booting{background:var(--launch-paper,#f5f7fa)}html.app-booting body{visibility:hidden;background:var(--launch-paper,#f3f5f8)}</style>

</head>

<button type="submit" class="settings bible-search-button" data-icon="search" aria-label="성경 검색 열기" aria-expanded="false" aria-controls="reader-search-input reader-search-results"></button>

</form>

</div></div></header>
