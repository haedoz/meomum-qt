<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="description" content="말씀을 읽고 묵상을 남기는 나만의 QT 노트">
<meta name="color-scheme" content="only light">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="로그바이블">
<link rel="apple-touch-icon" href="./icon-192.png"><link rel="manifest" href="./manifest.webmanifest?v=4">
<link rel="preload" href="./fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Serif+Hebrew:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css?v=140"><title>로그바이블</title>
<script type="module" src="./app.js?v=140"></script>
</head>
<body>
<header class="top"><div class="frame top-inner"><div class="top-start"><button class="back-button icon-action" data-action="back" data-icon="back" aria-label="뒤로가기" hidden></button><a class="brand" href="#today"><span class="brand-icon" data-icon="book"></span><span class="brand-name">로그바이블</span></a></div><div class="top-actions">
<form class="reader-search" id="reader-search" role="search" aria-label="성경 검색" autocomplete="off" hidden>
<input id="reader-search-input" type="search" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" maxlength="120" aria-label="단어, 문장, 성경책 이름 또는 구절 주소" placeholder="단어, 창세기, 창 12:3" hidden>
<button type="submit" class="settings bible-search-button" data-icon="search" aria-label="성경 검색 열기" aria-expanded="false" aria-controls="reader-search-input reader-search-results"></button>
<button type="button" class="settings reader-search-close" data-action="close-bible-search" data-icon="close" aria-label="성경 검색 닫기" hidden></button>
<div id="reader-search-results" class="reader-search-results" aria-live="polite" hidden></div>
</form>
<button class="settings" data-nav="settings" aria-label="저장 및 설정" data-icon="settings"></button>
</div></div></header>
<div class="workspace">
<main id="main" class="frame" tabindex="-1" aria-label="QT 기록"><p>말씀 노트를 열고 있어요…</p></main>
<nav class="bottom" aria-label="주 메뉴"><div class="frame nav-inner">
<button data-nav="today"><span data-icon="sun"></span>오늘</button><button data-nav="bible"><span data-icon="book"></span>성경</button><button data-nav="commentary"><span data-icon="comment"></span>주석</button><button data-nav="original"><span data-icon="note"></span>원전분해</button><button data-nav="records"><span data-icon="folder"></span>기록함</button>
</div></nav>
</div>
<dialog id="modal" aria-labelledby="active-dialog-title"></dialog><div id="toast" role="status" aria-live="polite"></div>
<noscript>QT 노트를 쓰려면 브라우저에서 자바스크립트를 켜주세요.</noscript>
</body></html>
